name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:mcp
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: novel-ui-userscript
          path: dist/novel-ui-renderer.user.js
          if-no-files-found: error

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          push: false
          tags: novel-runtime-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
